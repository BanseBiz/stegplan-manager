{% extends 'layout.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-6 mb-4">
    <a class="font-bold text-sm text-slate-500 hover:text-slate-800 transition" href="{{ url_for('index') }}">
        {{ t('btn_back_to_dashboard') | safe }}
    </a>
</div>
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-200">
    <h2 class="text-3xl font-extrabold mb-6 text-slate-800 text-center">{{ t('profile_title') }}</h2>
    
    {% if error %}
    <div class="bg-red-50 text-red-700 p-4 rounded-lg mb-6 border border-red-200 text-sm font-medium">
        {{ t(error) }}
    </div>
    {% endif %}

    {% if success %}
    <div class="bg-green-50 text-green-700 p-4 rounded-lg mb-6 border border-green-200 text-sm font-medium">
        {{ t(success) }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-5">
            <label class="block text-slate-700 text-sm font-bold mb-2" for="current_password">{{ t('profile_current_pw') }}</label>
            <input class="shadow-sm border border-slate-300 rounded-lg w-full py-2.5 px-4 text-slate-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="current_password" name="current_password" type="password" required autofocus>
        </div>

        <div class="mb-5">
            <label class="block text-slate-700 text-sm font-bold mb-2" for="new_password">{{ t('profile_new_pw') }}</label>
            <input class="shadow-sm border border-slate-300 rounded-lg w-full py-2.5 px-4 text-slate-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="new_password" name="new_password" type="password" required minlength="8">
        </div>

        <div class="mb-8">
            <label class="block text-slate-700 text-sm font-bold mb-2" for="confirm_password">{{ t('profile_confirm_pw') }}</label>
            <input class="shadow-sm border border-slate-300 rounded-lg w-full py-2.5 px-4 text-slate-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   id="confirm_password" name="confirm_password" type="password" required minlength="8">
        </div>

        <div class="flex items-center justify-end pt-4 border-t border-slate-200">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-500 transition" type="submit">
                {{ t('profile_btn_save') }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
